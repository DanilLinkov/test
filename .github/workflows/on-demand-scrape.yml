name: On-Demand Scrape

on:
  workflow_dispatch:
    inputs:
      ingredient:
        description: 'Ingredient to scrape'
        required: true
        type: string

permissions:
  contents: write
  pages: write

# Queue workflows - only one runs at a time, others wait
concurrency:
  group: scrape-workflow
  cancel-in-progress: false

jobs:
  scrape-single:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for rebasing

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrape single ingredient
        run: npx tsx src/scrape-single.ts "${{ github.event.inputs.ingredient }}"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Pull latest changes (rebase to avoid merge commits)
          git fetch origin main
          git rebase origin/main

          # Stage and commit if there are changes
          git add data/**/*.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ${{ github.event.inputs.ingredient }} prices [skip ci]"
            git push origin main
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
