name: On-Demand Scrape

on:
  workflow_dispatch:
    inputs:
      ingredient:
        description: 'Ingredient to scrape'
        required: true
        type: string

permissions:
  contents: write
  pages: write

jobs:
  scrape-single:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Scrape single ingredient
        run: npx tsx src/scrape-single.ts "${{ github.event.inputs.ingredient }}"

      - name: Commit and push results
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update ${{ github.event.inputs.ingredient }} prices [skip ci]'
          file_pattern: 'data/**/*.json'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./data
          publish_branch: gh-pages
